name: MOO
description: >-
  MOO is a London-founded online print and design company that produces premium custom
  business cards, postcards, flyers, stickers, notebooks, packaging, and branded promotional
  merchandise for individuals and businesses. Backed by Index Ventures, MOO combines a
  browser-based design experience with commercial printing, and sells tiered business
  plans (Business, Advanced, Enterprise) with team management and design services. MOO
  does not currently publish a public developer API, SDKs, or API documentation; its
  developer-style subdomains resolve to the main storefront rather than an API surface.
  This profile is maintained in the API Evangelist network as a company record.
